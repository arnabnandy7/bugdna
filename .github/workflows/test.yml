name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Verify Javadocs
        run: mvn --batch-mode --no-transfer-progress -Pcentral-publish -DskipTests -Dgpg.skip=true install

      - name: Run SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: mvn --batch-mode --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish test report
        uses: dorny/test-reporter@4a2e97665d5fa767581ef38eca97b9694bd4eef4
        if: always()
        with:
          name: JUnit Tests
          path: "**/target/surefire-reports/*.xml"
          reporter: java-junit

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
