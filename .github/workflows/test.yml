name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Java (Maven Reactor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify cross-language version alignment
        run: python3 compatibility-tests/check-versions.py

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Verify Javadocs
        run: mvn --batch-mode --no-transfer-progress -Pcentral-publish -DskipTests -Dgpg.skip=true install

      - name: Run SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: mvn --batch-mode --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        with:
          name: JUnit Tests
          path: "**/target/surefire-reports/*.xml"
          reporter: java-junit

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

  test-js:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bugdna-js
    strategy:
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit and compatibility tests
        run: npm test

      - name: Build ESM, CJS, and TypeScript declarations
        run: npm run build

  test-python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bugdna-python
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked test and build dependencies
        run: "python -m pip install --only-binary :all: --require-hashes -r requirements-ci.txt"

      - name: Run pytest unit and compatibility suite
        run: pytest -v

      - name: Build sdist and wheel
        run: python -m build --no-isolation
